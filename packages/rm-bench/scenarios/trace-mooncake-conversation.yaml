# Real trace replay: mooncake-conversation. Fetch first: rm-bench traces fetch
# Inspect: rm-bench traces stats trace-mooncake-conversation [--max-total-tokens N --no-filter]
# Run:     rm-bench e2e --scenario trace-mooncake-conversation --gateway URL [--speedup X] [--max-total-tokens N]
name: trace-mooncake-conversation
description: real arrival times, lengths and prefix sharing (hash_ids) from the Mooncake conversation trace
requests:
  source: trace
  trace:
    path: ${RM_BENCH_TRACES}/mooncake/conversation_trace.jsonl
    speedup: 1
    policy: skip
concurrency: 64
duration_s: 600
timeout_s: 300
seed: 0
max_error_pct: 1
slo:
  ttft_p90_ms: 5000
  tpot_p90_ms: 200

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rm-controller"
version = "0.2.0"
description = "ai-rm L4 placement controller: topology-aware and optimal P/D placement written to the airm-placement ConfigMap"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
dependencies = [
    "rm-core>=0.1.2,<0.2",           # not on PyPI: pip install "rm-core @ git+https://github.com/ai-computing/rm-core@v0.1.2" first
    "pyyaml",
]

[project.optional-dependencies]
k8s = ["kubernetes>=24.2.0"]
test = ["pytest"]

[project.scripts]
rm-controller = "rm_controller.controller:main"

[project.entry-points."airm.placements"]
topology = "rm_controller.policy:TopologyPlacement"
optimal = "rm_controller.optimal:OptimalPlacement"

[tool.setuptools]
packages = ["rm_controller"]

[tool.setuptools.package-data]
rm_controller = ["profiles.yaml"]

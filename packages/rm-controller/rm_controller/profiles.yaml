# Throughput profiles for the `optimal` policy and the simulator (rm_controller/sim.py).
#
# One entry per device type (`vendor.model`, as in the node labels) for ONE model class: Llama-3.1-8B-class
# models in bf16/fp16 on the host-staged serving path, with the S=512 graphs the live baselines ran
# (docs/baselines.md, 2026-10-19). Every number says where it comes from:
#   measured  -- read off a run recorded in ai-rm docs (docs/baselines.md, docs/e2e.md)
#   derived   -- arithmetic on measured numbers (the derivation is in `source`)
#   estimate  -- not measured; a placeholder until FASOP's NPU cost model (aicomp #50) or a sweep replaces it
# Lengths beyond the compiled S=512 graphs are extrapolated linearly (attention's quadratic term is ignored).
model: llama-3.1-8b
kv_bytes_per_token: 131072           # derived: 32 layers x 8 KV heads x 128 dim x 2 (K,V) x 2 bytes = 128 KiB

devices:
  furiosa.RNGD:
    group: 1                         # cards per serving instance; 48 GB holds the 16 GB of weights
    prefill_tok_s: 12000             # measured: rngd-full prefill 66-105 ms for 16-480 tokens at idle (S=512
    prefill_overhead_ms: 66          #   graphs, buckets 32-512), a linear fit; download spikes reach 245 ms
    tpot_ms_b1: 30.0                 # measured: continuous B=8 decode graph, 29.8 ms with one stream
    tpot_ms_bmax: 30.3               # measured: 30.3 ms with eight; the graph is fixed-width (B=1 graph: 16-19 ms)
    max_batch: 8                     # measured: continuous batching B=8 served the baselines
    kv_tokens: 250000                # derived: ~32 GB free after weights / 128 KiB per token; the S=512 graph
                                     #   itself holds max_batch x 512
    source:
      prefill_tok_s: measured
      tpot_ms_b1: measured
      tpot_ms_bmax: measured
      max_batch: measured
      kv_tokens: derived
  rebellions.ATOM:
    group: 1                         # measured: the fp16 decode artifact (32 layers on the card, embedding and
                                     #   lm_head on the host) runs on one 15.7 GiB card
    prefill_tok_s: 600               # estimate: RNGD's old rate x (2 x 32 / 256) peak TFLOPS, unmeasured
    prefill_overhead_ms: 80          # estimate
    tpot_ms_b1: 108.2                # measured: S=512 B=4 decode artifact, one stream
    tpot_ms_bmax: 108.6              # measured: four streams; fixed-width graph
    max_batch: 4                     # measured: the largest S=512 decode artifact compiled (B=8 exists for S=256)
    kv_tokens: 2048                  # derived: 4 lanes x 512
    source:
      prefill_tok_s: estimate
      tpot_ms_b1: measured
      tpot_ms_bmax: measured
      max_batch: measured
      kv_tokens: derived

# KV handoff from a prefill instance to a decode instance. scope: card (same card), host (same node),
# cluster (any two nodes). `pairs` limits a link to the prefill->decode types it was verified for (absent =
# any). `implemented: false` links exist only for what-if simulation; the controller never
# picks them for `kv_transport: auto`.
links:
  loopback:
    scope: card
    gb_s: 0                          # no copy
    latency_ms: 0
    implemented: true
    source: rm-core reference transport
  shm:
    scope: host
    gb_s: 1.6                        # measured: 67 MB loaded in 31-54 ms (median 33) at decode admission,
                                     #   PD_PREFETCH=0 (docs/baselines.md); 111 ms p90 with prefetch (docs/e2e.md)
    latency_ms: 0
    min_bytes: 67108864              # measured: copies the whole S=512 buffer whatever the prompt length
    implemented: true
    source: measured
  p2p:
    scope: host
    gb_s: 8.0                        # estimate: RNGD->ATOM PCIe device-to-device; exactness verified at 512,
    latency_ms: 2                    #   bandwidth not yet measured (hetero-npu-p2p)
    pairs: [furiosa.RNGD->rebellions.ATOM]   # prefill->decode types verified; other pairs are not offered
    implemented: true
    source: estimate
  tcp:
    scope: cluster
    gb_s: 0.5                        # estimate: host-staged on both ends like shm (0.6 GB/s), plus the wire
    latency_ms: 5
    implemented: false               # no cross-node airm.kv_transports plugin yet
    source: estimate

# Throughput profiles for the `optimal` policy and the simulator (rm_controller/sim.py).
#
# One entry per device type (`vendor.model`, as in the node labels) for ONE model class: Llama-3.1-8B-class
# models in bf16/fp16 on the host-staged serving path, with the S=512 graphs the live baselines ran
# (docs/baselines.md, 2026-10-19). Every number says where it comes from:
#   measured  -- read off a run recorded in ai-rm docs (docs/baselines.md, docs/e2e.md)
#   derived   -- arithmetic on measured numbers (the derivation is in `source`)
#   estimate  -- not measured; a placeholder until FASOP's NPU cost model (aicomp #50) or a sweep replaces it
# Lengths beyond the compiled S=512 graphs are extrapolated linearly (attention's quadratic term is ignored).
model: llama-3.1-8b
kv_bytes_per_token: 131072           # derived: 32 layers x 8 KV heads x 128 dim x 2 (K,V) x 2 bytes = 128 KiB

devices:
  furiosa.RNGD:
    group: 1                         # cards per serving instance; 48 GB holds the 16 GB of weights
    prefill_tok_s: 12000             # measured: rngd-full prefill 66-105 ms for 16-480 tokens at idle (S=512
    prefill_overhead_ms: 66          #   graphs, buckets 32-512), a linear fit; download spikes reach 245 ms
    tpot_ms_b1: 30.0                 # measured: continuous B=8 decode graph, 29.8 ms with one stream
    tpot_ms_bmax: 30.3               # measured: 30.3 ms with eight; the graph is fixed-width (B=1 graph: 16-19 ms)
    max_batch: 8                     # measured: continuous batching B=8 served the baselines
    kv_tokens: 250000                # derived: ~32 GB free after weights / 128 KiB per token; the S=512 graph
                                     #   itself holds max_batch x 512
    source:
      prefill_tok_s: measured
      tpot_ms_b1: measured
      tpot_ms_bmax: measured
      max_batch: measured
      kv_tokens: derived
  rebellions.ATOM:
    group: 1                         # measured: the fp16 decode artifact (32 layers on the card, embedding and
                                     #   lm_head on the host) runs on one 15.7 GiB card
    prefill_tok_s: 600               # estimate: RNGD's old rate x (2 x 32 / 256) peak TFLOPS, unmeasured
    prefill_overhead_ms: 80          # estimate
    tpot_ms_b1: 108.2                # measured: S=512 B=4 decode artifact, one stream
    tpot_ms_bmax: 108.6              # measured: four streams; fixed-width graph
    max_batch: 4                     # measured: the largest S=512 decode artifact compiled (B=8 exists for S=256)
    kv_tokens: 2048                  # derived: 4 lanes x 512
    source:
      prefill_tok_s: estimate
      tpot_ms_b1: measured
      tpot_ms_bmax: measured
      max_batch: measured
      kv_tokens: derived
  nvidia.A100:                       # A100 80GB, vLLM v0.11 (CUDA); the GPU baseline for W6, not an ai-rm serving path
    group: 1
    prefill_tok_s: 10000             # estimate: 312 TFLOPS bf16 dense (NVIDIA A100 datasheet) x ~50 % MFU
    prefill_overhead_ms: 20          #   / 16 GFLOP per token (2 x 8.0 B parameters); not measured here
    tpot_ms_b1: 11.0                 # estimate: 16 GB of weights per step over 2.0 TB/s HBM2e at ~75 % efficiency
    tpot_ms_bmax: 20.0               # derived: hetero-llm-d experiments/2026-10-19-hetero-llama8b-mixed-pool, A100
                                     #   alone, 128 requests at concurrency 64, ~110 output tokens, p50 latency
                                     #   2.39-2.43 s -> 20-25 ms per token including prefill and queueing (upper bound)
    max_batch: 64                    # measured: the concurrency of that run; vLLM allows more (max_num_seqs 256)
    kv_tokens: 400000                # derived: 80 GiB x 0.90 (--gpu-memory-utilization) - 15 GiB weights - ~4 GiB
                                     #   activations = ~53 GiB / 128 KiB per token (manifests/vllm-a100-llama31-8b.yaml)
    source:
      prefill_tok_s: estimate
      tpot_ms_b1: estimate
      tpot_ms_bmax: derived
      max_batch: measured
      kv_tokens: derived

# KV handoff from a prefill instance to a decode instance. scope: card (same card), host (same node),
# cluster (any two nodes). `pairs` limits a link to the prefill->decode types it was verified for (absent =
# any). `admit_blocking: true` means the decode instance pays the transfer at admission, stalling every
# active stream. `implemented: false` links exist only for what-if simulation; the controller never
# picks them for `kv_transport: auto`.
links:
  loopback:
    scope: card
    gb_s: 0                          # no copy
    latency_ms: 0
    implemented: true
    source: rm-core reference transport
  shm:
    scope: host
    gb_s: 1.6                        # measured: 67 MB loaded in 31-54 ms (median 33) at decode admission,
                                     #   PD_PREFETCH=0 (docs/baselines.md); 111 ms p90 with prefetch (docs/e2e.md)
    latency_ms: 0
    min_bytes: 67108864              # measured: copies the whole S=512 buffer whatever the prompt length
    admit_blocking: true             # measured: with PD_PREFETCH=0 rngd-pd's decode worker loads the KV when it admits a
                                     #   request, inside the device lock, and every active stream waits (31-54 ms);
                                     #   read by the rebalancer's predictor and the simulator's episode replay
    implemented: true
    source: measured
  p2p:
    scope: host
    gb_s: 8.0                        # estimate: RNGD->ATOM PCIe device-to-device; exactness verified at 512,
    latency_ms: 2                    #   bandwidth not yet measured (hetero-npu-p2p)
    pairs: [furiosa.RNGD->rebellions.ATOM]   # prefill->decode types verified; other pairs are not offered
    implemented: true
    source: estimate
  tcp:                               # rngd-pd `tcp` (airm.kv_transports): host-staged on both ends, pooled TCP,
    scope: cluster                   #   CRC-checked; measured RNGD -> CPU relay on another node -> RNGD, S=512
    gb_s: 0.08                       # measured: 67 MB in 832 ms (pull) / 758 ms (push) per request, one request at a
                                     #   time; the NPU node's 1 GbE NIC is the limit (0.117 GB/s per direction with 8 in
                                     #   flight, 0.095-0.108 with CRC off) (docs/baselines.md, cross-node KV)
    latency_ms: 14                   # derived: 64 blob round trips x 0.22 ms node-to-node RTT
    min_bytes: 67108864              # measured: the whole S=512 buffer goes over the wire whatever the prompt length
    admit_blocking: true             # measured: with PD_PREFETCH=0 the decode worker pulls the KV at admission
                                     #   (816 ms p50 in serving), as with shm
    implemented: true
    source: measured
  cuda-ipc:                          # GPU->GPU on one node, as vLLM's NixlConnector does it (UCX cuda_ipc)
    scope: host
    gb_s: 20.0                       # estimate: PCIe Gen4 x16 peer-to-peer; NVLink would be ~10x more
    latency_ms: 1
    pairs: [nvidia.A100->nvidia.A100]
    implemented: false               # upstream vLLM has it; ai-rm has no airm.kv_transports plugin for GPUs
    source: estimate

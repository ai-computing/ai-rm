<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="ai-rm: unified resource management for heterogeneous AI accelerators">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#18213f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <!-- title -->
  <text x="64" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="#ffffff">ai<tspan fill="url(#glow)">-</tspan>rm</text>
  <rect x="68" y="146" width="132" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="64" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#e5e7eb">AI 반도체 통합 자원관리</text>
  <text x="64" y="232" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9ca3af">One loop over GPUs, NPUs and unified memory —</text>
  <text x="64" y="258" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9ca3af">discover · place · serve · move · observe, on Kubernetes + llm-d</text>
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#c4b5fd">
    <rect x="64" y="282" width="118" height="30" rx="15" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.5"/>
    <text x="81" y="302">RNGD · ATOM</text>
    <rect x="192" y="282" width="96" height="30" rx="15" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="207" y="302" fill="#a5f3fc">GPU · GB10</text>
    <rect x="298" y="282" width="122" height="30" rx="15" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="313" y="302" fill="#a7f3d0">k8s + llm-d</text>
  </g>

  <!-- layer stack -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(640,40)">
      <rect width="500" height="44" rx="10" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.55"/>
      <text x="18" y="28" fill="#fbcfe8">L5  관측·운영</text><text x="482" y="28" text-anchor="end" font-weight="400" fill="#f9a8d4" font-size="14">lmd-top · rm-bench</text>
    </g>
    <g transform="translate(640,94)">
      <rect width="500" height="44" rx="10" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="18" y="28" fill="#fde68a">L4  클러스터·배치</text><text x="482" y="28" text-anchor="end" font-weight="400" fill="#fcd34d" font-size="14">llm-d-setup · EPP</text>
    </g>
    <g transform="translate(640,148)">
      <rect width="500" height="44" rx="10" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="18" y="28" fill="#a7f3d0">L3  실행·서빙</text><text x="482" y="28" text-anchor="end" font-weight="400" fill="#6ee7b7" font-size="14">rngd-pd · npu-lora</text>
    </g>
    <g transform="translate(640,202)">
      <rect width="500" height="44" rx="10" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="18" y="28" fill="#a5f3fc">L2  메모리·전송</text><text x="482" y="28" text-anchor="end" font-weight="400" fill="#67e8f9" font-size="14">hetero-npu-p2p · npu-offload · duet</text>
    </g>
    <g transform="translate(640,256)">
      <rect width="500" height="44" rx="10" fill="#7c5cff" fill-opacity="0.18" stroke="#7c5cff" stroke-opacity="0.6"/>
      <text x="18" y="28" fill="#ddd6fe">L1  가속기 추상화</text><text x="482" y="28" text-anchor="end" font-weight="400" fill="#c4b5fd" font-size="14">rm_abstract_layer</text>
    </g>
    <!-- loop arrow -->
    <path d="M1158 70 C1186 70 1186 280 1158 280" fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"/>
    <path d="M1158 70 l9 -6 M1158 70 l9 6" stroke="#7c5cff" stroke-width="3" stroke-linecap="round"/>
    <text x="1174" y="182" font-size="12" font-weight="500" fill="#9ca3af" transform="rotate(90 1174 182)" text-anchor="middle">rm-core contracts</text>
  </g>
</svg>

# Example site override for rm-abstract-node (rm-accel chart >= 0.5.0); copy to deploy/clusters/<name>/.
# The chart's defaults run the published image ghcr.io/ai-computing/rm-accel with the host's vendor
# tools mounted from /usr/bin (hostBin); no init container is needed. Set only what differs per site.
# hostBin: /usr/bin            # where nvidia-smi / furiosa-smi / rbln-stat live on the nodes
# image: {tag: master}         # a newer image than the chart's appVersion
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}

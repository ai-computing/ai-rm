<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="676" viewBox="0 0 1280 676" role="img" aria-labelledby="title desc"><title id="title">AI-RM target architecture with Optimus Prime</title><desc id="desc">L1 resource discovery, L2 memory modules, L3 Optimus Prime unified engine and training workloads, L4 Kubernetes llm-d and the FASOP planner integration boundary, L5 operations. Optimus Prime and FASOP share the aicomp repository. Consolidation is planned, not implemented by this documentation change. duet remains a private optional workload.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#65b9ff"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#09111f"/></linearGradient></defs><rect width="100%" height="100%" rx="22" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="51" font-size="30" fill="#e8f0ff" font-weight="600">One integration hub. Five technical layers.</text><text x="40" y="84" font-size="17" fill="#a8b9d0" font-weight="400">Logical architecture • integration targets; component readiness varies</text><rect x="32" y="110" width="1070" height="86" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(49 122) scale(0.85)" fill="none" stroke="#fa9ca5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 51V12 M9 51h47 M16 39l11-13 10 7 16-20"/><circle cx="27" cy="26" r="3"/><circle cx="37" cy="33" r="3"/></g><text x="124" y="144" font-size="22" fill="#fa9ca5" font-weight="700">L5</text><text x="185" y="144" font-size="23" fill="#e8f0ff" font-weight="600">Observability &amp; operations</text><text x="185" y="173" font-size="16" fill="#a8b9d0" font-weight="400">Latency, throughput, power and evidence</text><text x="620" y="159" font-size="18" fill="#e8f0ff" font-weight="500">lmd-top  /  rm-bench</text><rect x="32" y="209" width="1070" height="86" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(49 221) scale(0.85)" fill="none" stroke="#f4c46b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="6" width="20" height="16" rx="3"/><rect x="4" y="42" width="20" height="16" rx="3"/><rect x="40" y="42" width="20" height="16" rx="3"/><path d="M32 22v11 H14v9 M32 33h18v9"/></g><text x="124" y="243" font-size="22" fill="#f4c46b" font-weight="700">L4</text><text x="185" y="243" font-size="23" fill="#e8f0ff" font-weight="600">Cluster &amp; planning boundary</text><text x="185" y="272" font-size="16" fill="#a8b9d0" font-weight="400">Gateway / EPP; planner is part of Optimus Prime</text><text x="620" y="258" font-size="18" fill="#e8f0ff" font-weight="500">llm-d-setup  /  FASOP adapter (planned)</text><rect x="32" y="308" width="1070" height="86" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(49 320) scale(0.85)" fill="none" stroke="#a89bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 19h30 M30 10l9 9-9 9 M56 45H26 M34 36l-9 9 9 9"/><rect x="43" y="10" width="13" height="18" rx="3"/><rect x="8" y="36" width="13" height="18" rx="3"/></g><text x="124" y="342" font-size="22" fill="#a89bff" font-weight="700">L3</text><text x="185" y="342" font-size="23" fill="#e8f0ff" font-weight="600">Unified engine</text><text x="185" y="371" font-size="16" fill="#a8b9d0" font-weight="400">Inference consolidation target; npu-lora workload</text><text x="620" y="357" font-size="18" fill="#e8f0ff" font-weight="500">Optimus Prime (aicomp/opt_prime)</text><rect x="32" y="407" width="1070" height="86" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(49 419) scale(0.85)" fill="none" stroke="#65b9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="15" width="48" height="32" rx="5"/><path d="M16 47v8 M26 47v8 M38 47v8 M48 47v8"/><rect x="16" y="24" width="8" height="14" rx="2"/><rect x="28" y="24" width="8" height="14" rx="2"/><rect x="40" y="24" width="8" height="14" rx="2"/></g><text x="124" y="441" font-size="22" fill="#65b9ff" font-weight="700">L2</text><text x="185" y="441" font-size="23" fill="#e8f0ff" font-weight="600">Memory &amp; transport modules</text><text x="185" y="470" font-size="16" fill="#a8b9d0" font-weight="400">Engine modules planned; *private search workload</text><text x="620" y="456" font-size="18" fill="#e8f0ff" font-weight="500">KV transport  /  expert offload  /  duet*</text><rect x="32" y="506" width="1070" height="86" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(49 518) scale(0.85)" fill="none" stroke="#55d6be" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="36" rx="7"/><rect x="23" y="23" width="18" height="18" rx="3"/><path d="M22 6v8 M22 50v8 M6 22h8 M50 22h8"/><path d="M32 6v8 M32 50v8 M6 32h8 M50 32h8"/><path d="M42 6v8 M42 50v8 M6 42h8 M50 42h8"/></g><text x="124" y="540" font-size="22" fill="#55d6be" font-weight="700">L1</text><text x="185" y="540" font-size="23" fill="#e8f0ff" font-weight="600">Accelerator abstraction</text><text x="185" y="569" font-size="16" fill="#a8b9d0" font-weight="400">Device discovery, capabilities and plugins</text><text x="620" y="555" font-size="18" fill="#e8f0ff" font-weight="500">rm_abstract_layer</text><rect x="1120" y="110" width="128" height="482" rx="16" fill="#182841" stroke="#55d6be"/><text x="1137" y="154" font-size="22" fill="#55d6be" font-weight="600">rm-core</text><text x="1137" y="201" font-size="18" fill="#a8b9d0" font-weight="400">Shared</text><text x="1137" y="237" font-size="18" fill="#a8b9d0" font-weight="400">contracts</text><text x="1137" y="273" font-size="18" fill="#a8b9d0" font-weight="400"></text><text x="1137" y="309" font-size="18" fill="#a8b9d0" font-weight="400">Adapters</text><text x="1137" y="345" font-size="18" fill="#a8b9d0" font-weight="400">Metrics</text><text x="1137" y="381" font-size="18
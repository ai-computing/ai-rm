<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc"><title id="title">Target Optimus Prime request flow</title><desc id="desc">Client requests pass through Gateway and EPP to planned Optimus Prime prefill and decode workers. Existing RNGD/ATOM PD technology is a migration source. A named, supported KV transport connects stages; P2P remains same-host and hardware dependent. Integration is not implemented by this documentation change.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#65b9ff"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#09111f"/></linearGradient></defs><rect width="100%" height="100%" rx="22" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#e8f0ff" font-weight="600">One engine boundary for heterogeneous inference</text><text x="40" y="85" font-size="17" fill="#a8b9d0" font-weight="400">Target: Optimus Prime workers • NPU/backend migration and llm-d adapter remain planned</text><rect x="40" y="135" width="170" height="105" rx="16" fill="#14233a" stroke="#304563"/><text x="58" y="177" font-size="23" fill="#e8f0ff" font-weight="600">Client</text><text x="58" y="212" font-size="17" fill="#a8b9d0" font-weight="400">LLM request</text><rect x="267" y="135" width="255" height="105" rx="16" fill="#14233a" stroke="#304563"/><text x="285" y="177" font-size="23" fill="#e8f0ff" font-weight="600">Gateway + EPP</text><text x="285" y="212" font-size="17" fill="#a8b9d0" font-weight="400">L4 · route / place</text><rect x="580" y="135" width="280" height="105" rx="16" fill="#14233a" stroke="#304563"/><text x="598" y="177" font-size="23" fill="#e8f0ff" font-weight="600">Prefill worker</text><text x="598" y="212" font-size="17" fill="#a8b9d0" font-weight="400">Optimus Prime · target</text><rect x="923" y="135" width="310" height="105" rx="16" fill="#14233a" stroke="#304563"/><text x="941" y="177" font-size="23" fill="#e8f0ff" font-weight="600">Decode worker</text><text x="941" y="212" font-size="17" fill="#a8b9d0" font-weight="400">Optimus Prime · target</text><path d="M211 188 L263 188" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M524 188 L576 188" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M864 188 L919 188" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><text x="882" y="122" font-size="17" fill="#55d6be" font-weight="600">KV</text><rect x="580" y="286" width="653" height="94" rx="16" fill="#14233a" stroke="#65b9ff"/><text x="600" y="322" font-size="22" fill="#e8f0ff" font-weight="600">L2 · choose a named KV transport</text><text x="600" y="354" font-size="17" fill="#a8b9d0" font-weight="400">p2p: compatible same-host devices  /  shm: host staging</text><path d="M720 242 L720 282" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1076 282 L1076 244" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="286" width="481" height="94" rx="16" fill="#14233a" stroke="#55d6be"/><text x="60" y="322" font-size="22" fill="#e8f0ff" font-weight="600">L1 · device capabilities</text><text x="60" y="354" font-size="17" fill="#a8b9d0" font-weight="400">Discovery, memory, precision and peak source</text><rect x="40" y="431" width="1193" height="97" rx="16" fill="#14233a" stroke="#fa9ca5"/><text x="60" y="468" font-size="23" fill="#fa9ca5" font-weight="600">L5 · observe and evaluate</text><text x="60" y="503" font-size="20" fill="#e8f0ff" font-weight="400">Prometheus / Grafana  →  lmd-top    |    rm-bench  →  TTFT · TPOT · tok/s · SLO</text><path d="M907 383 L907 426" fill="none" stroke="#65b9ff" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/></g></svg>

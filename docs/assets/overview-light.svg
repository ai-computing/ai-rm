<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="422" viewBox="0 0 1280 422" role="img" aria-labelledby="title desc"><title id="title">AI-RM and Optimus Prime target architecture</title><desc id="desc">AI-RM coordinates resource contracts, Kubernetes llm-d and operations. Optimus Prime is the planned engine consolidation target, with opt_prime runtime and FASOP planning in one product. Inference planning and PD/KV/offload migration remain future work. Hardware labels describe research scope, not certified support.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8b96a8"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#ffffff"/><g font-family="Segoe UI, Arial, sans-serif"><rect x="24" y="24" width="1232" height="108" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="48" y="68" font-size="28" fill="#1f2328" font-weight="650">AI-RM</text><text x="1000" y="65" font-size="14" fill="#59636e" font-weight="600">INTEGRATION HUB</text><text x="48" y="106" font-size="21" fill="#59636e" font-weight="400">Resource contracts  /  Kubernetes + llm-d  /  Operations &amp; measurements</text><path d="M640 140 L640 164" fill="none" stroke="#8b96a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="24" y="178" width="1232" height="162" rx="10" fill="#ffffff" stroke="#d1d9e0"/><text x="48" y="210" font-size="14" fill="#107e72" font-weight="600">OPTIMUS PRIME  /  ENGINE CONSOLIDATION TARGET</text><text x="48" y="258" font-size="27" fill="#1f2328" font-weight="600">Inference runtime</text><text x="48" y="298" font-size="18" fill="#59636e" font-weight="400">opt_prime/  ·  PD, KV and offload integration planned</text><path d="M640 230V314" stroke="#d1d9e0"/><text x="676" y="258" font-size="27" fill="#1f2328" font-weight="600">FASOP</text><text x="676" y="298" font-size="18" fill="#59636e" font-weight="400">fasop/  ·  Planning &amp; search</text><text x="48" y="391" font-size="13" fill="#59636e" font-weight="600">RESEARCH SCOPE</text><text x="230" y="393" font-size="20" fill="#1f2328" font-weight="400">GPU  ·  FuriosaAI RNGD  ·  Rebellions ATOM  ·  CPU  ·  GB10</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc"><title id="title">AI-RM memory paths</title><desc id="desc">hetero-npu-p2p transfers KV between compatible same-host NPUs. npu-offload separates hot NPU experts and cold host CPU experts. Private optional duet combines CPU graph traversal and GPU distance computation in GB10 unified memory.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#65b9ff"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#09111f"/></linearGradient></defs><rect width="100%" height="100%" rx="22" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="52" font-size="30" fill="#e8f0ff" font-weight="600">Three memory paths. Different jobs.</text><text x="40" y="85" font-size="17" fill="#a8b9d0" font-weight="400">Memory integration is workload specific; these paths are not interchangeable.</text><rect x="32" y="115" width="1216" height="119" rx="16" fill="#14233a" stroke="#304563"/><text x="52" y="145" font-size="14" fill="#55d6be" font-weight="700">KV CACHE TRANSFER</text><text x="52" y="180" font-size="24" fill="#e8f0ff" font-weight="600">hetero-npu-p2p</text><text x="52" y="209" font-size="16" fill="#a8b9d0" font-weight="400">Same-host KV movement with completion fencing</text><rect x="680" y="143" width="230" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="694" y="179" font-size="16" fill="#e8f0ff" font-weight="500">RNGD device memory</text><path d="M916 173 L966 173" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="975" y="143" width="251" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="989" y="179" font-size="16" fill="#e8f0ff" font-weight="500">ATOM device memory</text><rect x="32" y="250" width="1216" height="119" rx="16" fill="#14233a" stroke="#304563"/><text x="52" y="280" font-size="14" fill="#65b9ff" font-weight="700">MoE EXPERT OFFLOAD</text><text x="52" y="315" font-size="24" fill="#e8f0ff" font-weight="600">npu-offload</text><text x="52" y="344" font-size="16" fill="#a8b9d0" font-weight="400">Partition expert execution across device and host</text><rect x="680" y="278" width="230" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="694" y="314" font-size="16" fill="#e8f0ff" font-weight="500">NPU HBM · hot experts</text><path d="M916 308 L966 308" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="975" y="278" width="251" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="989" y="314" font-size="16" fill="#e8f0ff" font-weight="500">Host CPU / DRAM · cold experts</text><rect x="32" y="385" width="1216" height="119" rx="16" fill="#14233a" stroke="#304563"/><text x="52" y="415" font-size="14" fill="#a89bff" font-weight="700">UNIFIED-MEMORY SEARCH</text><text x="52" y="450" font-size="24" fill="#e8f0ff" font-weight="600">duet · private / optional</text><text x="52" y="479" font-size="16" fill="#a8b9d0" font-weight="400">GB10 shared memory for cooperative vector search</text><rect x="680" y="413" width="230" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="694" y="449" font-size="16" fill="#e8f0ff" font-weight="500">CPU · graph traversal</text><path d="M916 443 L966 443" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="975" y="413" width="251" height="61" rx="16" fill="#1c304b" stroke="#304563"/><text x="989" y="449" font-size="16" fill="#e8f0ff" font-weight="500">GPU · distance calculation</text></g></svg>

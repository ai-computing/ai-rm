<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="262" viewBox="0 0 1280 262" role="img" aria-labelledby="title desc"><title id="title">Research evidence workflow</title><desc id="desc">Discover device capabilities, connect implementations through rm-core contracts, execute workloads with explicit transport selection, and record measurements with reproducible run context.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#65b9ff"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#09111f"/></linearGradient></defs><rect width="100%" height="100%" rx="22" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="51" font-size="30" fill="#e8f0ff" font-weight="600">From hardware to reproducible evidence</text><rect x="40" y="88" width="270" height="136" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(56 103) scale(0.65)" fill="none" stroke="#55d6be" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="14" width="36" height="36" rx="7"/><rect x="23" y="23" width="18" height="18" rx="3"/><path d="M22 6v8 M22 50v8 M6 22h8 M50 22h8"/><path d="M32 6v8 M32 50v8 M6 32h8 M50 32h8"/><path d="M42 6v8 M42 50v8 M6 42h8 M50 42h8"/></g><text x="118" y="125" font-size="23" fill="#e8f0ff" font-weight="600">Discover</text><text x="58" y="192" font-size="18" fill="#a8b9d0" font-weight="400">Devices &amp; profiles</text><path d="M316 155 L342 155" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="350" y="88" width="270" height="136" rx="16" fill="#14233a" stroke="#304563"/><g transform="translate(366 103) scale(0.65)" fill="none" stroke="#65b9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="7" width="36" height="50" rx="6"/><path d="M23 20h18 M23 30h18 M23 43l6 6 12-13"/></g><text x="428" y="125" font-size
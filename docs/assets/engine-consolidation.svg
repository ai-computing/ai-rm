<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc"><title id="title">Optimus Prime consolidation target</title><desc id="desc">AI-RM owns resource, contract, Kubernetes llm-d and observation integration. Optimus Prime in aicomp owns the unified runtime at opt_prime and FASOP planning at fasop. The proposed optimus-prime branch is not created. Current training cost search is not yet an inference SLO optimizer. Existing repositories remain pinned migration sources; npu-lora and private duet remain workloads.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#65b9ff"/></marker><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#09111f"/></linearGradient></defs><rect width="100%" height="100%" rx="22" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="51" font-size="30" fill="#e8f0ff" font-weight="600">AI-RM coordinates. Optimus Prime executes.</text><text x="40" y="85" font-size="17" fill="#a8b9d0" font-weight="400">Target ownership • existing source repositories remain pinned during migration</text><rect x="32" y="114" width="1216" height="82" rx="16" fill="#14233a" stroke="#f4c46b"/><text x="52" y="149" font-size="25" fill="#f4c46b" font-weight="600">AI-RM  /  resource &amp; cluster integration</text><text x="52" y="179" font-size="18" fill="#e8f0ff" font-weight="400">rm-core contracts  ·  device inventory  ·  Kubernetes + llm-d  ·  lmd-top  ·  rm-bench</text><path d="M639 201 L639 236" fill="none" stroke="#65b9ff" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="246" width="1216" height="289" rx="16" fill="#14233a" stroke="#55d6be"/><text x="52" y="283" font-size="27" fill="#55d6be" font-weight="700">OPTIMUS PRIME  /  ai-computing/aicomp</text><text x="52" y="315" font-size="18" fill="#a8b9d0" font-weight="400">Current source: main  ·  planned integration branch: optimus-prime (not created here)</text><rect x="52" y="340" width="556" height="167" rx="16" fill="#1b3047" stroke="#304563"/><text x="73" y="377" font-size="24" fill="#e8f0ff" font-weight="600">Runtime  /  opt_prime</text><text x="73" y="413" font-size="18" fill="#a8b9d0" font-weight="400">PP/TP inference, prefill/decode, KV cache</text><text x="73" y="444" font-size="18" fill="#a8b9d0" font-weight="400">Planned: NPU backends, PD, KV, expert offload</text><text x="73" y="477" font-size="17" fill="#55d6be" font-weight="400">One runtime owner; modules keep explicit contracts</text><rect x="629" y="340" width="597" height="167" rx="16" fill="#1b3047" stroke="#304563"/><text x="650" y="377" font-size="24" fill="#e8f0ff" font-weight="600">Planner  /  fasop</text><text x="650" y="413" font-size="18" fill="#a8b9d0" font-weight="400">Current: training cost / TP-PP-DP search</text><text x="650" y="444" font-size="18" fill="#a8b9d0" font-weight="400">Planned: calibrated inference planning adapter</text><text x="650" y="477" font-size="17" fill="#f4c46b" font-weight="400">Cost estimates ≠ measured inference SLO</text><text x="40" y="585" font-size="18" fill="#65b9ff" font-weight="600">MIGRATION SOURCES → ENGINE MODULES (PLANNED)</text><rect x="32" y="605" width="1216" height="75" rx="16" fill="#14233a" stroke="#304563"/><text x="52" y="636" font-size="20" fill="#e8f0ff" font-weight="400">rngd-pd  ·  hetero-npu-p2p  ·  npu-offload  ·  engine-facing rm_abstract_layer adapters</text><text x="52" y="664" font-size="17" fill="#a8b9d0" font-weight="400">Keep source submodules until implementation, conformance and end-to-end acceptance pass.</text><text x="40" y="727" font-size="19" fill="#a89bff" font-weight="600">EXTERNAL WORKLOADS   npu-lora: training adapter  /  duet: private search workload</text></g></svg>

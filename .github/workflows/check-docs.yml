name: check-docs

on:
  push:
  pull_request:

jobs:
  links-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check local documentation links, image descriptions and SVGs
        run: python3 tools/check_docs.py

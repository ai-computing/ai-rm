name: rm-controller-image

# ghcr.io/ai-computing/rm-controller (packages/rm-controller/Dockerfile), used by charts/ai-rm.
# Pull requests build and smoke-test it; master pushes :master, tags rm-controller-vX.Y.Z push :X.Y.Z.
on:
  push:
    branches: [master]
    tags: ["rm-controller-v*"]
    paths: ["packages/rm-controller/**", ".github/workflows/rm-controller-image.yml"]
  pull_request:
    paths: ["packages/rm-controller/**", ".github/workflows/rm-controller-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ai-computing/rm-controller

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=rm-controller-v(\d+\.\d+\.\d+),group=1
            type=ref,event=branch
            type=sha,format=short
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: packages/rm-controller
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha,scope=rm-controller
          cache-to: type=gha,mode=max,scope=rm-controller
      - name: Smoke test
        run: |
          docker run --rm ${{ env.IMAGE }}:test --help
          test "$(docker run --rm --entrypoint id ${{ env.IMAGE }}:test -u)" = 65534
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packages/rm-controller
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=rm-controller
